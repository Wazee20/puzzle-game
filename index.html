<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="لعبة تركيب الصور — العب على هاتفك أو ثبّتها على الشاشة الرئيسية.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="تركيب الصور">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>لعبة تركيب الصور</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./app-icon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game">
    <h1>تركيب الصور</h1>

    <section class="controls">
      <label>الصورة
        <select id="imageSelect">
          <option value="IMG_0910.jpeg">الصورة الأولى</option>
          <option value="IMG_1750.jpeg">الصورة الثانية</option>
        </select>
      </label>

      <label>الصعوبة
        <select id="difficulty">
          <option value="3">سهل — 3×3</option>
          <option value="4" selected>متوسط — 4×4</option>
          <option value="5">صعب — 5×5</option>
        </select>
      </label>

      <button id="startButton" type="button">بدء اللعبة</button>
      <button id="shuffleButton" type="button">إعادة ترتيب</button>
      <button id="installButton" type="button" hidden>تثبيت اللعبة</button>
    </section>

    <p class="install-help">للتثبيت: على iPhone اضغط «مشاركة» ثم «إضافة إلى الشاشة الرئيسية». على Android افتح قائمة المتصفح واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p>

    <section class="stats" aria-live="polite">
      <span>الحركات: <strong id="moves">0</strong></span>
      <span>الوقت: <strong id="time">0:00</strong></span>
    </section>

    <div id="board" class="board" aria-label="لوحة تركيب الصورة"></div>
    <p id="message" class="message" aria-live="polite"></p>
  </main>
  <script src="./script.js"></script>
</body>
</html>
